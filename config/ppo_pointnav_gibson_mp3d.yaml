# @package _global_

defaults:
  # training on both datasets
  - /benchmark/nav/pointnav: pointnav_gibson_mp3d
  - /habitat_baselines: habitat_baselines_rl_config_base
  - _self_

habitat_baselines:
  verbose: False
  trainer_name: "ppo"
  torch_gpu_id: 0

  tensorboard_dir: "tb/multi_dataset_gibson_mp3d/"
  video_dir: "video_dir/multi_dataset_gibson_mp3d/"

  # checkpoints
  checkpoint_folder: "data/new_checkpoints/multi_dataset_gibson_mp3d"
  eval_ckpt_path_dir: "data/new_checkpoints/multi_dataset_gibson_mp3d"

  # keep same as your setup
  num_environments: 2         
  total_num_steps: 15e6
  num_updates: -1
  num_checkpoints: 100
  log_interval: 25

  load_resume_state_config: True
  force_torch_single_threaded: True


  eval:
    video_option: [ ]
    # Can be uncommented to generate videos.
    # video_option: ["disk", "tensorboard"]

  rl:
    ppo:
      # ppo params
      clip_param: 0.2
      ppo_epoch: 4
      num_mini_batch: 2
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.5
      num_steps: 128
      hidden_size: 512
      use_gae: True
      gamma: 0.99
      tau: 0.95
      use_linear_clip_decay: True
      use_linear_lr_decay: True
      reward_window_size: 50

      use_double_buffered_sampler: False
